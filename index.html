<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador Molecular CFA — Chemical for All</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Explorador Molecular CFA</h1><p>Chemical for All — Explore estruturas químicas em duas e três dimensões.</p></header>
    <main>
        <section aria-labelledby="titulo-molecula">
            <label for="seletor-composto">Escolha um composto:</label>
            <select id="seletor-composto"></select>
            <h2 id="titulo-molecula">Explorador Molecular</h2>
            <p id="descricao-composto">Carregando o catálogo de compostos…</p>
            <div id="legenda" class="legenda"></div>
            <div id="visualizador" role="region" aria-label="Modelo molecular 3D" aria-describedby="detalhe-3d"><p>Carregando o modelo 3D…</p></div>
            <p id="detalhe-3d" role="status" aria-live="polite"></p>
            <button id="rotacao" type="button" aria-pressed="false" disabled>Iniciar rotação</button>
            <button id="restaurar" type="button" disabled>Restaurar visualização</button>
        </section>
        <section aria-labelledby="titulo-informacoes">
            <h2 id="titulo-informacoes">Informações do composto</h2>
            <dl id="ficha"></dl>
            <details><summary>Átomos, cargas e ligações em texto</summary><ul id="estrutura-textual"></ul></details>
        </section>
    </main>
    <noscript>Ative o JavaScript para selecionar compostos e consultar suas estruturas.</noscript>
    <!-- Snapshot de release recomendado na documentação oficial; sem URL mutável. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.1/3Dmol-min.js"></script>
    <script src="catalog.js"></script>
    <script src="complemento.js"></script>
    <script src="script.js"></script>
</body>
</html>
